name: release

# Push tag vX.Y.Z -> build Windows + macOS, tạo và publish GitHub Release kèm zip, dmg, SHA256SUMS.txt và
# SHA256SUMS.txt.sig (ký bằng secret WISP_SIGNING_KEY, xem tools/release_sign.py).
# Action được pin theo commit SHA (tag có thể bị dời); khi nâng version, lấy SHA mới bằng git ls-remote.
# Release được publish ngay, không qua draft: app của người dùng thấy bản mới ở lần kiểm tra kế tiếp.
# Bản macOS đang ở giai đoạn 1 (thử nghiệm): nếu job macOS lỗi, release vẫn được tạo với bản Windows.
# Chạy tay (workflow_dispatch) chỉ build và upload artifact, không tạo release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Mặc định chỉ đọc; chỉ job release được ghi.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Kiểm tra tag khớp __version__ và CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}  # qua env, không dán thẳng vào script (tên tag được chứa $, `, ...)
        run: |
          v=$(python3 -c "import pet_tracker; print(pet_tracker.__version__)")
          if [ "v$v" != "$TAG" ]; then
            echo "Tag $TAG không khớp pet_tracker.__version__ = $v"; exit 1
          fi
          python3 tools/changelog_section.py "$TAG" > release-notes.md
      - name: Kiểm tra khoá ký (secret WISP_SIGNING_KEY khớp khoá công khai trong app)
        env:
          WISP_SIGNING_KEY: ${{ secrets.WISP_SIGNING_KEY }}
        run: |
          echo "wisp signing check" > signcheck.txt
          python3 tools/release_sign.py sign signcheck.txt
          python3 tools/release_sign.py verify signcheck.txt
      - name: Notes rỗng khi chạy tay
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: echo "manual build" > release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Kiểm tra code import được
        shell: pwsh
        run: python -c "import sys; sys.path.insert(0, '.'); import pet_tracker.ui, pet_tracker.updater; print('ok')"
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Python python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wisp-windows
          path: dist/wisp-*-win-x64.zip

  macos:
    needs: check
    runs-on: macos-14
    env:
      PY_VERSION: "3.13.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Cài Python universal2 từ python.org (có Tk)
        run: |
          curl -fsSLo python.pkg "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "PYTHON=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13" >> "$GITHUB_ENV"
      - name: Kiểm tra code import được
        run: |
          "$PYTHON" -c "import sys; sys.path.insert(0, '.'); import pet_tracker.platform as p, pet_tracker.ui, pet_tracker.updater; print('ok', p.NAME)"
      - name: Build
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wisp-macos
          path: dist/wisp-*-macos-universal2.dmg

  release:
    needs: [windows, macos]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
      - name: SHA256SUMS.txt
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" \) -exec cp {} out/ \;
          # Bản không kèm version cho link tải cố định trong README (releases/latest/download/<tên>);
          # app cập nhật vẫn dùng bản có version
          for f in out/wisp-*-win-x64.zip out/wisp-*-macos-universal2.dmg; do
            if [ -e "$f" ]; then cp "$f" "out/$(basename "$f" | sed -E 's/^wisp-[^-]+-/wisp-/')"; fi
          done
          cp artifacts/release-notes/release-notes.md notes.md
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Ký SHA256SUMS.txt (app từ chối cập nhật nếu thiếu chữ ký)
        env:
          WISP_SIGNING_KEY: ${{ secrets.WISP_SIGNING_KEY }}
        run: python3 tools/release_sign.py sign out/SHA256SUMS.txt
      - name: Tạo và publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          extra=""
          if [ "$MACOS_RESULT" != "success" ]; then
            extra=$'\n\n> Bản macOS chưa có trong release này (job macOS lỗi).'
          fi
          printf '%s%s\n' "$(cat notes.md)" "$extra" > release-notes.md
          gh release create "$TAG" out/* --repo "$REPO" \
            --title "Wisp $TAG" --notes-file release-notes.md
