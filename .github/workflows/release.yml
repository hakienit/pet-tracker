name: release

# Push tag vX.Y.Z -> build bản Windows, tạo GitHub Release dạng DRAFT kèm zip + SHA256SUMS.txt.
# Người duyệt mở draft trên GitHub, kiểm tra rồi bấm Publish; chỉ khi đó app của người dùng mới thấy bản mới
# (API releases/latest bỏ qua draft và pre-release).
# Chạy tay (workflow_dispatch) chỉ build và upload artifact, không tạo release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kiểm tra tag khớp __version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (python -c "import pet_tracker; print(pet_tracker.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} không khớp pet_tracker.__version__ = $v"
          }
          python tools/changelog_section.py "${{ github.ref_name }}" | Out-File -Encoding utf8 release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG.md thiếu mục cho ${{ github.ref_name }}" }

      - name: Kiểm tra code import được
        shell: pwsh
        run: python -c "import sys; sys.path.insert(0, '.'); import pet_tracker.ui, pet_tracker.updater; print('ok')"

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Python python

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "pet-tracker-*-win-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "không thấy file zip trong dist" }
          $h = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($zip.Name)" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pet-tracker-windows
          path: |
            dist/pet-tracker-*-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Tạo GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist -Filter "pet-tracker-*-win-x64.zip" | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $zip dist/SHA256SUMS.txt `
            --draft --title "Claude PET ${{ github.ref_name }}" --notes-file release-notes.md
