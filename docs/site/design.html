<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp · design spec</title>
<link rel="icon" href="img/favicon.png" type="image/png">
<meta name="description" content="Wisp UI spec: island, bubble, mascots, panel, settings, menus, notifications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/wisp-ui.css">
<style>
:root{--bg:#0d0e11;--fg:#ebecf0;--mut:#a2a6b1;--line:#262830;--acc:#ffb02e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header.top{position:sticky;top:0;z-index:50;background:rgba(13,14,17,.95);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header.top h1{margin:0;font-size:18px;font-weight:700}
header.top nav{display:flex;flex-wrap:wrap;gap:4px 14px}
header.top nav a{color:var(--mut);text-decoration:none;font-size:13px}
header.top nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid #3a3d47;border-radius:9px;overflow:hidden;margin-left:auto}
.lang button{font-size:13px;font-weight:600;padding:7px 12px;min-height:34px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:#1a1205}
main{padding:24px;display:flex;flex-direction:column;gap:48px;max-width:1380px}
h2{margin:0 0 6px;font-size:22px}
h3{margin:0;font-size:16px}
.lead{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.5;max-width:900px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-width:0}
.stage.dark{background:#252a31}.stage.light{background:#cfd6df}
.cap{font-size:12px;font-weight:600}
.stage.dark .cap,.stage.dark .lb{color:#b4b8c2}.stage.light .cap,.stage.light .lb{color:#3d4350}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.lb{font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.tabs button{font-size:13px;padding:7px 12px;min-height:34px;border-radius:999px;border:1px solid #3a3d47;background:transparent;color:var(--mut);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#2a2c33;color:var(--fg);border-color:#4a4d57}
.tabs .t{font-size:13px;color:var(--mut)}
.grid-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:#16181d;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;align-items:center;gap:8px}
.card .no{font-size:12px;color:var(--mut)}
.def{font-size:11px;font-weight:700;color:#1a1205;background:var(--acc);border-radius:999px;padding:2px 8px}
.moods{display:flex;gap:6px;background:#0f1013;border-radius:10px;padding:6px;justify-content:center}
.sw{width:36px;height:22px;border-radius:11px;position:relative;flex:none}
.sw i{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.lane-h{display:flex;align-items:center;gap:6px;font-size:var(--t-body);font-weight:700;border:0;background:transparent;padding:4px 2px;min-height:30px;cursor:pointer;width:100%;text-align:left}
.tok{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tok div{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--mut)}
.tok b{display:block;height:26px;border-radius:6px;margin-bottom:6px}
footer{padding:0 24px 40px;color:var(--mut);font-size:13px;line-height:1.6;max-width:900px}
</style>
</head>
<body>
<header class="top">
  <h1 id="h1"></h1>
  <nav id="nav"></nav>
  <div class="lang" role="group" aria-label="Language"><button data-l="vi">Tiếng Việt</button><button data-l="en">English</button></div>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script src="assets/wisp-ui.js"></script>
<script>
const PAGE = {
  vi: { title: 'Wisp · spec thiết kế (final)', nav: ['Island', 'Bóng nổi', 'Mascot', 'Panel', 'Cài đặt', 'Cập nhật', 'Menu', 'Thông báo', 'Token'],
    def: 'mặc định', defaults: 'Mặc định khi cài mới: island; bóng tín hiệu "Vòng liền"; mascot "Wisp cổ điển", màu gốc; chip "% + đèn"; giao diện theo hệ thống; ngôn ngữ theo hệ điều hành.',
    island: 'Mỗi trạng thái một kiểu viền động. Mũi tên xanh: có bản mới.',
    bubble: 'Người dùng chọn trong Cài đặt → Bóng nổi: kiểu tín hiệu (6 kiểu viền) hoặc mascot (40 mẫu, 8 màu, ảnh riêng, 3 kiểu chip). Mascot của bóng cũng là mascot ở đầu panel.',
    sig: 'Tín hiệu · 6 kiểu viền', mb: 'Mascot · 40 mẫu', chipLbl: 'Chip dưới chân', bg: 'Nền',
    mascot: '40 mẫu chia 4 nhóm, 8 màu, hoặc ảnh riêng PNG/SVG (có chuyển động, không có biểu cảm). 5 biểu cảm: rảnh · chạy · cần bạn · xong · gần hết quota.',
    panel: 'Bấm tên làn để thu / mở. Card có nền và viền theo trạng thái.', settings: 'Trang chính và trang con Bóng nổi. Bấm thử các lựa chọn.',
    update: 'Banner nằm ngay dưới header panel.', menu: 'Xác nhận xoá dùng khối xác nhận trong menu (kiểu 01).', toast: '"Cần bạn" giữ tới khi xử lý và có âm thanh; loại khác tự ẩn sau 6 giây.',
    tokens: 'Màu, chữ, chuyển động dùng chung. Bản app lấy từ đây vào theme.py.',
    foot: 'Spec final cho Wisp 0.2. Animation ở đây là CSS; bản tkinter vẽ bằng khung hình dựng sẵn nên gần giống, không giống hệt.' },
  en: { title: 'Wisp · design spec (final)', nav: ['Island', 'Bubble', 'Mascots', 'Panel', 'Settings', 'Update', 'Menus', 'Notifications', 'Tokens'],
    def: 'default', defaults: 'Fresh-install defaults: island; signal bubble "Solid ring"; mascot "Classic wisp", original colour; chip "% + lamps"; theme follows the system; language follows the OS.',
    island: 'One animated border per state. Blue arrow: update available.',
    bubble: 'Users pick in Settings → Bubble: signal (6 border styles) or mascot (40 mascots, 8 colours, own image, 3 chip styles). The bubble mascot is also the panel mascot.',
    sig: 'Signal · 6 border styles', mb: 'Mascot · 40 mascots', chipLbl: 'Chip under the feet', bg: 'Background',
    mascot: '40 mascots in 4 groups, 8 colours, or your own PNG/SVG (moves, no expressions). 5 expressions: idle · running · needs you · done · quota low.',
    panel: 'Click a lane title to collapse or expand. Cards are tinted and bordered by state.', settings: 'Main page and the Bubble sub-page. Try the options.',
    update: 'The banner sits right under the panel header.', menu: 'Delete confirmation uses the confirm block in the menu (style 01).', toast: '"Needs you" stays until handled and plays a sound; others hide after 6 seconds.',
    tokens: 'Shared colour, type and motion tokens. The app copies these into theme.py.',
    foot: 'Final spec for Wisp 0.2. Animations here are CSS; the tkinter build uses pre-rendered frames, so it looks close, not identical.' },
};
let MBT = 'dark';
function render() {
  const l = L(), p = PAGE[LANG];
  uid = 0;
  document.documentElement.lang = LANG;
  document.title = p.title;
  document.getElementById('h1').textContent = p.title;
  const ids = ['island', 'bubble', 'mascot', 'panel', 'settings', 'update', 'menu', 'toast', 'tokens'];
  document.getElementById('nav').innerHTML = ids.map((id, i) => `<a href="#${id}">${p.nav[i]}</a>`).join('');
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === LANG));
  const sec = (id, h, lead, body) => `<section id="${id}"><h2>${h}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}${body}</section>`;
  const st4 = ['idle', 'run', 'wait', 'quota'], st5 = ['idle', 'run', 'wait', 'done', 'quota'];
  const def = (on) => (on ? `<span class="def">${p.def}</span>` : '');
  const sigRows = SIG.map((sv, i) => `<div class="card"><div class="hd"><span class="no num">${String(i + 1).padStart(2, '0')}</span><h3>${sv[LANG]}</h3>${def(sv.id === 's01')}</div>
    <div class="duo">${both((t) => `<div class="row">${st4.map((v) => `<div class="cell">${sigBubble(sv, v, t)}<span class="lb">${l.st[v]}</span></div>`).join('')}<div class="cell">${sigBubble(sv, 'run', t, true)}<span class="lb">${l.updLamp}</span></div></div>`)}</div></div>`).join('');
  const tm = T[MBT];
  const mbCtl = `<div class="tabs"><span class="t">${p.chipLbl}:</span>${l.chips.map((c, i) => `<button data-chip="${i}" aria-pressed="${i === CHIP}">${c}</button>`).join('')}<span style="width:14px"></span><span class="t">${p.bg}:</span>${['dark', 'light'].map((k) => `<button data-mbt="${k}" aria-pressed="${k === MBT}">${l[k]}</button>`).join('')}</div>`;
  const mbRows = `<div class="grid-m" style="grid-template-columns:repeat(auto-fill,minmax(540px,1fr))">${MASCOTS.map((m) => `<div class="card"><div class="hd"><span class="no num">${m.id.slice(1)}</span><h3>${m[LANG]}</h3>${def(m.id === 'm01')}</div>
    <div class="stage ${MBT}" style="padding:12px 10px 18px"><div class="row" style="gap:4px 6px;justify-content:space-between">${st5.map((v) => `<div class="cell" style="width:92px">${mascotBubble(m.id, v, tm)}<span class="lb" style="margin-top:10px">${l.st[v]}</span></div>`).join('')}</div></div></div>`).join('')}</div>`;
  const list = CATSEL === 'all' ? MASCOTS : MASCOTS.filter((x) => CAT[CATSEL].includes(x.id));
  const gallery = `<div class="tabs">${Object.keys(l.cats).map((k) => `<button data-cat="${k}" aria-pressed="${k === CATSEL}">${l.cats[k]} <span style="opacity:.6">${k === 'all' ? MASCOTS.length : CAT[k].length}</span></button>`).join('')}
      <span style="width:14px"></span><span class="t">${l.hue}:</span>${HUE_SW.map((c, i) => `<button data-hue="${i}" aria-pressed="${i === HUE}" aria-label="${l.hueNames[i]}" style="width:28px;height:28px;padding:0;border-radius:50%;background:${c};border:2px solid ${i === HUE ? '#fff' : 'transparent'}"></button>`).join('')}</div>
    <div class="grid-m">${list.map((x) => `<div class="card" style="align-items:center"><div class="hd" style="align-self:stretch"><span class="no num">${x.id.slice(1)}</span><b style="font-size:14px">${x[LANG]}</b>${def(x.id === 'm01')}</div>
      ${mascot(x.id, 88, 'run', T.dark)}<div class="moods">${st5.map((md) => mascot(x.id, 30, md, T.dark, '')).join('')}</div></div>`).join('')}
      <div class="card" style="align-items:center;justify-content:center;text-align:center;border-style:dashed;color:var(--mut);font-size:13px"><span style="color:var(--fg)">${ic('up', 28, 2)}</span><b style="color:var(--fg)">${l.upload[0]}</b>${l.upload[1]}</div></div>`;
  const updKinds = ['avail', 'dl', 'verify', 'install', 'err', 'mac', 'latest'];
  const tokens = `<div class="tok">${[['dark', 'wait'], ['dark', 'run'], ['dark', 'done'], ['dark', 'idle'], ['dark', 'danger'], ['dark', 'bg'], ['dark', 'surf'], ['light', 'wait'], ['light', 'run'], ['light', 'done'], ['light', 'idle'], ['light', 'danger'], ['light', 'bg'], ['light', 'surf']].map(([k, n]) => `<div><b style="background:${T[k][n]}"></b>${k}.${n}<br><span class="mono">${T[k][n]}</span></div>`).join('')}</div>
    <div class="tok" style="margin-top:8px">${[['meta', '12px'], ['body', '13px'], ['title', '14px / 700'], ['head', '15px / 800'], ['num', '18px / 700']].map(([n, v]) => `<div>type.${n}<br><span class="mono">${v}</span></div>`).join('')}${[['enter', '180ms ease-out'], ['exit', '120ms'], ['island resize', '200ms'], ['border loop', '1.8–6s']].map(([n, v]) => `<div>motion.${n}<br><span class="mono">${v}</span></div>`).join('')}</div>`;
  const html = [
    `<p class="lead" style="margin:0;color:var(--fg)">${p.defaults}</p>`,
    sec('island', 'Island', p.island, `<div class="duo">${both((t) => st4.map((v) => `<div class="row" style="gap:16px"><span class="lb" style="width:110px">${l.st[v]}</span>${island(v, t)}</div>`).join('') + `<div class="row" style="gap:16px"><span class="lb" style="width:110px">${l.updLamp}</span>${island('run', t, true)}</div>`)}</div>`),
    sec('bubble', p.nav[1], p.bubble, `<h3 style="margin:4px 0 10px">${p.sig}</h3><div style="display:flex;flex-direction:column;gap:12px">${sigRows}</div><h3 style="margin:24px 0 10px">${p.mb}</h3>${mbCtl}${mbRows}`),
    sec('mascot', p.nav[2], p.mascot, gallery),
    sec('panel', 'Panel', p.panel, `<div class="duo">${both((t) => `<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${island('wait', t, true)}${panel(t)}</div>`)}</div>`),
    sec('settings', p.nav[4], p.settings, `<div class="duo">${both((t) => `<div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center">${settings(t)}${bubbleSettings(t)}</div>`)}</div>`),
    sec('update', p.nav[5], p.update, `<div class="duo">${both((t) => updKinds.map((k, i) => `<div style="display:flex;flex-direction:column;gap:6px"><span class="lb">${l.updLabels[i]}</span><div style="width:372px;max-width:100%;background:${t.bg};border-radius:14px;padding:10px">${updBanner(t, k)}</div></div>`).join(''))}</div>`),
    sec('menu', p.nav[6], p.menu, `<div style="display:flex;flex-direction:column;gap:16px">${both((t) => menus(t))}</div>`),
    sec('toast', p.nav[7], p.toast, `<div class="duo">${both((t) => `<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">${toasts(t)}</div>`)}</div>`),
    sec('tokens', p.nav[8], p.tokens, tokens),
  ];
  document.getElementById('main').innerHTML = html.join('');
  const only = new URLSearchParams(location.search).get('s');
  if (only) document.querySelectorAll('main > section').forEach((x) => { x.hidden = x.id !== only; });
  document.getElementById('foot').textContent = p.foot;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const y = scrollY;
  let changed = handleCustomize(b);
  if (b.dataset.mbt) { MBT = b.dataset.mbt; changed = true; }
  if (b.dataset.cat) { CATSEL = b.dataset.cat; changed = true; }
  if (changed) { render(); scrollTo(0, y); }
});
render();
</script>
</body>
</html>
