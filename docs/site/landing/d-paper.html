<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp · Paper</title>
<meta name="description" content="Wisp: know the moment your Claude Code agents need you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/wisp-ui.css">
<style>
:root{--bg:#f3efe6;--ink:#15130f;--mut:#5c574c;--line:#d9d2c3;--acc:#d9531e;--card:#fbf9f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
a{color:var(--acc)}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
nav .wrap{display:flex;align-items:center;gap:26px;min-height:68px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink)}
.brand{font-weight:900;font-stretch:118%;font-size:20px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.links{display:flex;gap:22px;flex-wrap:wrap}.links a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.links a:hover{text-decoration:underline;text-underline-offset:4px}
.sp{flex:1}
.seg{display:flex;border:1.5px solid var(--ink)}
.seg button{font-size:12px;font-weight:800;padding:6px 11px;min-height:32px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;padding:64px 0 34px;align-items:end;border-bottom:1.5px solid var(--ink)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--acc);margin-bottom:16px}
h1{font-size:clamp(46px,7.6vw,104px);line-height:.92;letter-spacing:-.04em;font-weight:900;font-stretch:112%;margin:0}
.sub{font-size:17px;color:var(--mut);margin:0 0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800;padding:13px 20px;min-height:48px;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--bg)}.btn.sec{color:var(--ink);border:1.5px solid var(--ink)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cmd{margin-top:16px;border:1.5px solid var(--ink);background:var(--card);display:flex;align-items:center}
.cmd code{flex:1;min-width:0;padding:10px 12px;overflow-x:auto;white-space:nowrap;font-family:'Cascadia Mono',Consolas,Menlo,monospace;font-size:12.5px}
.cmd button{align-self:stretch;border:0;border-left:1.5px solid var(--ink);background:transparent;font-weight:800;font-size:12px;padding:0 14px;cursor:pointer;color:var(--ink)}
.show{margin-top:34px;position:relative;background:linear-gradient(170deg,#e4ddd0,#d8d0c1);border:1.5px solid var(--ink);padding:26px 26px 0;min-height:600px;overflow:hidden}
.show .isl{display:flex;justify-content:center}
.show .row{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;margin-top:22px;align-items:start}
@media (max-width:900px){.show .row{grid-template-columns:minmax(0,1fr)}.show .notes{display:none}}
.notes{display:flex;flex-direction:column;gap:18px;padding-top:30px}
.notes div{border-top:1.5px solid var(--ink);padding-top:10px}
.notes b{font-size:13px;letter-spacing:.06em;color:var(--acc)}.notes p{margin:4px 0 0;font-size:15px}
.show::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(transparent,#d8d0c1);pointer-events:none}
section{padding:72px 0 0}
.sh{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;border-top:1.5px solid var(--ink);padding-top:16px;margin-bottom:30px}
@media (max-width:640px){.sh{grid-template-columns:minmax(0,1fr)}}
.sh .no{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--acc)}
.sh h2{margin:0;font-size:clamp(30px,4.2vw,50px);line-height:1;letter-spacing:-.03em;font-weight:900;font-stretch:110%}
.sh p{margin:10px 0 0;color:var(--mut);max-width:620px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
@media (max-width:760px){.list{grid-template-columns:minmax(0,1fr)}}
.list div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.list .n{font-size:13px;font-weight:800;color:var(--mut);padding-top:3px}
.list b{font-size:18px;font-weight:800}.list p{margin:4px 0 0;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1.5px solid var(--ink)}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps div{padding:24px;border-right:1.5px solid var(--ink)}.steps div:last-child{border-right:0}
.steps b{display:block;font-size:64px;line-height:1;font-weight:900;font-stretch:112%;color:var(--acc)}
.steps h3{margin:12px 0 4px;font-size:20px}.steps p{margin:0;color:var(--mut)}
.play{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
@media (max-width:960px){.play{grid-template-columns:minmax(0,1fr)}}
.bigb{border:1.5px solid var(--ink);background:linear-gradient(170deg,#e4ddd0,#d8d0c1);min-height:320px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;padding:26px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}.lb{font-size:12px;color:#3d3a33}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.mgrid button{background:transparent;border:0;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:14px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer;min-height:44px}
.mgrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1.5px solid var(--ink)}
@media (max-width:760px){.inst{grid-template-columns:minmax(0,1fr)}}
.inst article{padding:22px}.inst article+article{border-left:1.5px solid var(--ink)}
.inst h3{margin:0 0 10px;font-size:14px;letter-spacing:.04em}
.inst pre{margin:0 0 12px;background:var(--card);border:1px solid var(--line);padding:12px;overflow-x:auto;font-size:12.5px;font-family:'Cascadia Mono',Consolas,Menlo,monospace}
.inst button{font-size:12px;font-weight:800;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:7px 12px;cursor:pointer}
.priv{margin-top:26px;font-size:15px;color:var(--mut);max-width:760px}
footer{margin-top:80px;border-top:1.5px solid var(--ink);padding:24px 0 50px;color:var(--mut);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{color:var(--ink)}
.sw{width:36px;height:22px;border-radius:11px;position:relative;flex:none}.sw i{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
</style>
</head>
<body class="light">
<nav><div class="wrap"><a class="brand" href="#top">Wisp</a><div class="links" id="links"></div><span class="sp"></span><span id="lang"></span></div></nav>
<main id="top"></main>
<footer><div class="wrap" id="foot"></div></footer>
<script src="../assets/wisp-ui.js"></script>
<script src="../assets/landing-copy.js"></script>
<script>
const t = T.light;
function render() {
  const c = C(), l = L();
  uid = 0;
  document.documentElement.lang = LANG;
  document.getElementById('links').innerHTML = ['#what', '#how', '#custom', '#mascots', '#install'].map((h, i) => `<a href="${h}">${[c.links[0], LANG === 'vi' ? 'Cách dùng' : 'How it works', c.links[1], c.links[2], c.links[3]][i]}</a>`).join('') + `<a href="${REPO}">GitHub</a>`;
  document.getElementById('lang').innerHTML = langSwitch('seg');
  const st = BUBTYPE === 'mascot' ? ['idle', 'run', 'wait', 'done', 'quota'] : ['idle', 'run', 'wait', 'quota'];
  const sec = (id, no, h, p, body) => `<section id="${id}"><div class="wrap"><div class="sh"><span class="no">${no}</span><div><h2>${h}</h2>${p ? `<p>${p}</p>` : ''}</div></div>${body}</div></section>`;
  document.getElementById('top').innerHTML = `
  <div class="wrap">
    <div class="hero"><div><div class="kicker">${c.eyebrow.toUpperCase()}</div><h1>${c.h1}</h1></div>
      <div><p class="sub">${c.sub}</p><div class="cta"><a class="btn pri" href="${WIN_ZIP}">${ic('dl', 18, 2.4)}${c.dlWin}</a><a class="btn sec" href="${MAC_DMG}">${c.dlMac}</a></div>
      <div class="cmd"><code>${escH(WIN_CMD)}</code>${copyBtn(WIN_CMD)}</div></div></div>
    <div class="show"><div class="isl">${island('wait', t)}</div>
      <div class="row"><div class="notes">${c.feats.slice(0, 3).map(([, , h, p], i) => `<div><b>0${i + 1}</b><p><strong>${h}.</strong> ${p}</p></div>`).join('')}
        <div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;border-top:1.5px solid var(--ink);padding-top:18px">${sigBubble(SIG[0], 'wait', t)}${mascotBubble(MASCOT, 'done', t)}
          <div style="width:300px;background:#fff;border:1.5px solid var(--ink);padding:11px 13px;display:flex;gap:10px"><span style="color:${t.wait}">${ic('bell', 17, 2.2)}</span><div style="min-width:0"><div style="font-size:13px;font-weight:800">${l.toast[0][0]}</div><div class="mono ell" style="font-size:11.5px;color:${t.mut}">${l.toast[0][1]}</div></div></div></div></div>
      <div>${panel(t)}</div></div></div>
  </div>
  ${sec('what', '01', c.fH, c.fL, `<div class="list">${c.feats.map(([icn, col, h, p], i) => `<div><span class="n">${String(i + 1).padStart(2, '0')}</span><span><b>${h}</b><p>${p}</p></span></div>`).join('')}</div>`)}
  ${sec('how', '02', c.steps.map((s) => s[1]).join(' · '), '', `<div class="steps">${c.steps.map(([n, h, p]) => `<div><b>${n}</b><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`)}
  ${sec('custom', '03', c.cH, c.cL, `<div class="play"><div class="bigb">${st.map((v) => `<div class="cell">${bubble(v, t)}<span class="lb" style="margin-top:${BUBTYPE === 'mascot' ? 8 : 0}px">${l.st[v]}</span></div>`).join('')}</div><div>${bubbleSettings(t)}</div></div>`)}
  ${sec('mascots', '04', c.mH, c.mL, `<div class="mgrid">${MASCOTS.map((m) => `<button data-m="${m.id}" aria-pressed="${m.id === MASCOT}" title="${m[LANG]}">${mascot(m.id, 54, m.id === MASCOT ? 'done' : 'run', t, m.id === MASCOT ? 'm-done' : '')}<span class="ell" style="max-width:88px">${m[LANG]}</span></button>`).join('')}</div>`)}
  ${sec('install', '05', c.inH, c.inL, `<div class="inst"><article><h3>${c.win.toUpperCase()}</h3><pre>${escH(WIN_CMD)}</pre>${copyBtn(WIN_CMD)} <a href="${WIN_ZIP}" style="margin-left:10px">${c.manual}</a></article>
    <article><h3>${c.mac.toUpperCase()}</h3><pre>${escH(MAC_CMD)}</pre>${copyBtn(MAC_CMD)} <a href="${MAC_DMG}" style="margin-left:10px">${c.manual}</a></article></div><p class="priv"><strong>${c.prH}.</strong> ${c.prL}</p>`)}`;
  document.getElementById('foot').innerHTML = `<span>${c.foot}</span><span>${footLinks()}</span>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const y = scrollY;
  if (handleCustomize(b)) { render(); scrollTo(0, y); }
});
wireCopy();
render();
</script>
</body>
</html>
