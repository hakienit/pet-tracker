<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp · Terminal</title>
<meta name="description" content="Wisp: know the moment your Claude Code agents need you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/wisp-ui.css">
<style>
:root{--bg:#0c0e12;--fg:#e8ebf2;--mut:#8b93a5;--line:#1f242e;--card:#11141a;--acc:#ffb454;--grn:#aad94c;--blu:#59c2ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif;line-height:1.55;overflow-x:hidden;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}
.m{font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:var(--blu)}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
nav .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;border-bottom:1px dashed #262c38}
.brand{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--fg);text-decoration:none}
.brand small{color:var(--mut);font-weight:400}
.links{display:flex;gap:18px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:13px}
.links a{color:var(--mut);text-decoration:none}.links a:hover{color:var(--acc)}
.links a::before{content:"./";color:#4b5366}
.sp{flex:1}
.seg{display:flex;border:1px solid #2a3140;border-radius:6px;overflow:hidden}
.seg button{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:7px 11px;min-height:34px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#14100a}
.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:44px;align-items:center;padding:70px 0 40px}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}}
.prompt{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--grn)}
.prompt span{color:var(--mut)}
h1{font-size:clamp(38px,5.4vw,62px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:16px 0 0}
h1 .cur{display:inline-block;width:.5em;height:.82em;background:var(--acc);vertical-align:-.06em;margin-left:.08em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){h1 .cur{animation:none}}
.sub{color:var(--mut);font-size:17px;max-width:520px;margin:18px 0 26px}
.term-cmd{border:1px solid #2a3140;border-radius:10px;background:#07090c;overflow:hidden;max-width:560px}
.term-cmd .tabs{display:flex;border-bottom:1px solid #1f242e}
.term-cmd .tabs button{font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 14px;min-height:38px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.term-cmd .tabs button[aria-pressed="true"]{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.term-cmd .tabs [data-copy]{margin-left:auto;color:var(--fg)}
.term-cmd pre{margin:0;padding:14px;font-size:13px;overflow-x:auto;color:#d7dde8}
.term-cmd pre::before{content:"$ ";color:var(--grn)}
.dl{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:13px}
.dl a{text-decoration:none;border-bottom:1px dashed}
.free{margin-top:14px;font-size:12.5px;color:#5f687b;font-family:'JetBrains Mono',monospace}
.wnd{position:relative;border:1px solid #2a3140;border-radius:12px;background:#0a0c10;box-shadow:0 30px 80px rgba(0,0,0,.55);padding-top:38px;min-height:430px}
.wnd .bar{position:absolute;left:0;right:0;top:0;height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #1f242e}
.wnd .bar i{width:11px;height:11px;border-radius:50%;background:#2c3341}
.wnd .bar span{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:#5f687b}
.wnd .isl{position:absolute;left:50%;top:-18px;transform:translateX(-50%)}
.lines{padding:18px 18px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.85}
.lines div{opacity:0;transform:translateY(3px);transition:opacity .35s,transform .35s;white-space:pre-wrap}
.lines div.on{opacity:1;transform:none}
.lines .u{color:var(--fg)}.lines .t{color:var(--blu)}.lines .ok{color:var(--grn)}.lines .q{color:#14100a;background:var(--acc);display:inline;padding:1px 6px;border-radius:3px}
.wnd .tst{position:absolute;right:16px;bottom:16px;transition:opacity .35s,transform .35s}
.wnd .tst.off{opacity:0;transform:translateY(8px)}
.steps{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px}
.steps span{padding:5px 10px;border:1px solid #2a3140;border-radius:5px;color:var(--mut)}
.steps span.on{color:#14100a;border-color:transparent}
.steps button{padding:5px 10px;border:1px solid #2a3140;border-radius:5px;background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;font-size:12px}
section{padding:80px 0 0}
.h2{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px dashed #262c38;padding-bottom:14px}
.h2 h2{margin:0;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em}
.h2 p{margin:0;color:var(--mut)}
.h2 .n{font-family:'JetBrains Mono',monospace;color:var(--acc);font-size:14px}
.man{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
@media (max-width:760px){.man{grid-template-columns:minmax(0,1fr)}}
.man div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.man b{font-size:16px}.man p{margin:4px 0 0;color:var(--mut);font-size:14.5px}
.man .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.play{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
@media (max-width:960px){.play{grid-template-columns:minmax(0,1fr)}}
.bigb{border:1px solid #2a3140;border-radius:12px;background:#0a0c10;min-height:320px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;padding:26px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}.lb{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mgrid button{background:#0a0c10;border:1px solid #232937;border-radius:8px;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-family:'JetBrains Mono',monospace;font-size:10.5px;cursor:pointer;min-height:44px}
.mgrid button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.inst{grid-template-columns:minmax(0,1fr)}}
.inst article{border:1px solid #2a3140;border-radius:10px;background:#0a0c10;padding:18px}
.inst h3{margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mut);font-weight:500}
.inst pre{margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:13px;overflow-x:auto;color:#d7dde8}
.inst pre::before{content:"$ ";color:var(--grn)}
.inst .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.inst button{font-family:inherit;font-size:12px;border:1px solid #2a3140;background:transparent;color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer}
.priv{margin-top:60px;border:1px dashed #2a3140;border-radius:10px;padding:22px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--mut)}
.priv b{color:var(--grn)}
footer{margin-top:70px;border-top:1px dashed #262c38;padding:26px 0 50px;color:#5f687b;font-size:12.5px;font-family:'JetBrains Mono',monospace}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{color:var(--mut)}
.sw{width:36px;height:22px;border-radius:11px;position:relative;flex:none}.sw i{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="#top" id="brand"></a><div class="links" id="links"></div><span class="sp"></span><span id="lang"></span></div></nav>
<main id="top"></main>
<footer><div class="wrap" id="foot"></div></footer>
<script src="../assets/wisp-ui.js"></script>
<script src="../assets/landing-copy.js"></script>
<script>
const t = T.dark;
let STAGE = 'idle', OS = /Mac/i.test(navigator.platform || '') ? 'mac' : 'win', loop = null;
const LINES = [['u', '$ claude'], ['u', '> fix the auth redirect bug'], ['t', '⏺ Read(src/auth/redirect.ts)'], ['t', '⏺ Update(src/auth/redirect.ts)  +12 −3'],
  ['ok', '⏺ Bash(npm test)  ✓ 48 passed'], ['q', 'Allow Bash: git push origin main ?  1. Yes  2. No'], ['ok', '⏺ Pushed. Redirect fixed and tested.']];
const UPTO = { idle: 1, run: 5, wait: 6, done: 7 };
function termHTML() {
  const l = L();
  const tst = STAGE === 'wait' || STAGE === 'done';
  const k = STAGE === 'wait' ? 0 : 1;
  return `<div class="isl">${island(STAGE, t)}</div><div class="bar"><i></i><i></i><i></i><span>claude</span></div>
    <div class="lines">${LINES.map(([c, x], i) => `<div class="${i < UPTO[STAGE] ? 'on' : ''}"><span class="${c}">${escH(x)}</span></div>`).join('')}</div>
    <div class="tst ${tst ? '' : 'off'}"><div style="width:300px;background:${t.surf};border:1px solid ${t.line};border-radius:12px;box-shadow:${t.shadow};padding:11px 13px;display:flex;gap:10px;color:${t.fg}">
      <span style="color:${k ? t.done : t.wait}">${ic(k ? 'done' : 'bell', 17, 2.2)}</span><div style="min-width:0"><div style="font-size:13px;font-weight:700">${l.toast[k][0]}</div><div class="ell m" style="font-size:11.5px;color:${t.mut}">${l.toast[k][1]}</div></div></div></div>`;
}
function setStage(s) {
  STAGE = s;
  const w = document.getElementById('wnd');
  if (!w) return;
  uid = 0;
  w.innerHTML = termHTML();
  const i = DEMO.indexOf(s);
  document.getElementById('steps').innerHTML = DEMO.map((k, j) => `<span class="${j === i ? 'on' : ''}" style="${j === i ? `background:${t[k]}` : ''}">${String(j + 1).padStart(2, '0')} ${L().st[k]}</span>`).join('') +
    `<button id="pp">${loop && !loop.playing ? '▶ ' + C().play : '❚❚ ' + C().pause}</button>`;
  document.getElementById('cap').textContent = '# ' + C().demo[i];
}
function render() {
  const c = C(), l = L();
  document.documentElement.lang = LANG;
  document.getElementById('brand').innerHTML = `${mascot(MASCOT, 26, 'run', t, '')}wisp<small>@0.2</small>`;
  document.getElementById('links').innerHTML = ['#features', '#custom', '#mascots', '#install'].map((h, i) => `<a href="${h}">${c.links[i].toLowerCase()}</a>`).join('') + `<a href="${REPO}">github</a>`;
  document.getElementById('lang').innerHTML = langSwitch('seg');
  const cmd = OS === 'win' ? WIN_CMD : MAC_CMD;
  const st = BUBTYPE === 'mascot' ? ['idle', 'run', 'wait', 'done', 'quota'] : ['idle', 'run', 'wait', 'quota'];
  document.getElementById('top').innerHTML = `
  <div class="wrap hero" data-shot="hero"><div>
      <div class="prompt">wisp <span>--watch claude-code</span></div>
      <h1>${c.h1}<span class="cur"></span></h1>
      <p class="sub">${c.sub}</p>
      <div class="dl"><a href="${WIN_ZIP}">↓ wisp-win-x64.zip</a><a href="${MAC_DMG}">↓ wisp-macos.dmg (beta)</a></div>
      <div class="free"># ${c.free}</div>
    </div><div data-shot="demo">
      <div class="wnd" id="wnd"></div>
      <div class="steps" id="steps"></div>
      <div class="free m" id="cap"></div>
  </div><div class="wide">
      <div class="term-cmd"><div class="tabs">${[['win', 'PowerShell'], ['mac', 'zsh · macOS']].map(([k, n]) => `<button data-os="${k}" aria-pressed="${OS === k}">${n}</button>`).join('')}${copyBtn(cmd)}</div><pre class="m">${cmdHL(cmd)}</pre></div>
  </div></div>
  <section id="features" data-shot="features"><div class="wrap"><div class="h2"><span class="n">01</span><h2>${c.fH}</h2><p>${c.fL}</p></div>
    <div class="man">${c.feats.map(([icn, col, h, p]) => `<div><span class="ic" style="background:${t[col]}1c;color:${t[col]}">${ic(icn, 18, 2.2)}</span><span><b>${h}</b><p>${p}</p></span></div>`).join('')}</div></div></section>
  <section id="custom" data-shot="custom"><div class="wrap"><div class="h2"><span class="n">02</span><h2>${c.cH}</h2><p>${c.cL}</p></div>
    <div class="play"><div class="bigb">${st.map((v) => `<div class="cell">${bubble(v, t)}<span class="lb" style="margin-top:${BUBTYPE === 'mascot' ? 8 : 0}px">${l.st[v]}</span></div>`).join('')}</div><div>${bubbleSettings(t)}</div></div></div></section>
  <section id="mascots" data-shot="mascots"><div class="wrap"><div class="h2"><span class="n">03</span><h2>${c.mH}</h2><p>${c.mL}</p></div>
    <div class="mgrid">${MASCOTS.map((m) => `<button data-m="${m.id}" aria-pressed="${m.id === MASCOT}" title="${m[LANG]}">${mascot(m.id, 52, m.id === MASCOT ? 'done' : 'run', t, m.id === MASCOT ? 'm-done' : '')}<span class="ell" style="max-width:84px">${m.id}</span></button>`).join('')}</div></div></section>
  <section id="install" data-shot="install"><div class="wrap"><div class="h2"><span class="n">04</span><h2>${c.inH}</h2><p>${c.inL}</p></div>
    <div class="inst"><article><h3># ${c.win}</h3>${cmdBlock(WIN_CMD)}<div class="row"><a href="${WIN_ZIP}">${c.manual}</a></div></article>
    <article><h3># ${c.mac}</h3>${cmdBlock(MAC_CMD)}<div class="row"><a href="${MAC_DMG}">${c.manual}</a></div></article></div>
    <div class="priv"><b>// ${c.prH}</b><br>${c.prL}</div></div></section>`;
  document.getElementById('foot').innerHTML = `<span>${c.foot}</span><span>${footLinks()}</span>`;
  setTimeout(applyShot, 0);
  setStage(STAGE);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'pp') { loop.toggle(); setStage(STAGE); return; }
  const y = scrollY;
  if (b.dataset.os) { OS = b.dataset.os; render(); scrollTo(0, y); return; }
  if (handleCustomize(b)) { render(); scrollTo(0, y); }
});
wireCopy();
render();
loop = demoLoop(setStage);
</script>
</body>
</html>
