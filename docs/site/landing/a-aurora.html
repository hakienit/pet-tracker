<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp · Aurora</title>
<meta name="description" content="Wisp: know the moment your Claude Code agents need you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/wisp-ui.css">
<style>
:root{--bg:#07080b;--fg:#f1f2f6;--mut:#9ea3b0;--line:#1d2028;--card:#0e1015;--acc:#ffb02e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(900px 520px at 18% -8%,rgba(255,140,60,.16),transparent 60%),
             radial-gradient(800px 600px at 92% 8%,rgba(88,166,255,.14),transparent 60%),
             radial-gradient(700px 500px at 50% 110%,rgba(63,208,164,.08),transparent 60%)}
a{color:#9cc7ff}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(7,8,11,.72);border-bottom:1px solid rgba(255,255,255,.06)}
nav .wrap{display:flex;align-items:center;gap:22px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--fg);text-decoration:none}
.links{display:flex;gap:18px;flex-wrap:wrap}
.links a{color:var(--mut);text-decoration:none;font-size:14px}.links a:hover{color:var(--fg)}
.sp{flex:1}
.seg{display:flex;border:1px solid #2a2d36;border-radius:999px;overflow:hidden}
.seg button{font-size:12px;font-weight:700;padding:7px 12px;min-height:34px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.seg button[aria-pressed="true"]{background:#22252d;color:var(--fg)}
.gh{font-size:13px;font-weight:700;color:var(--fg);text-decoration:none;border:1px solid #2a2d36;border-radius:999px;padding:8px 14px}
.hero{text-align:center;padding:76px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#ffd79a;border:1px solid rgba(255,176,46,.35);background:rgba(255,176,46,.08);border-radius:999px;padding:6px 14px}
h1{font-size:clamp(42px,7vw,84px);line-height:.98;letter-spacing:-.035em;font-weight:800;font-stretch:92%;margin:22px auto 0;max-width:900px}
h1 em{font-style:normal;background:linear-gradient(92deg,#ffd36b,#ff8a4c 45%,#ff6166);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(16px,2vw,19px);color:var(--mut);max-width:640px;margin:20px auto 0}
.cta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:13px 20px;min-height:48px;border-radius:12px;text-decoration:none}
.btn.pri{background:linear-gradient(180deg,#ffbe4d,#ff9a2e);color:#1a1205;box-shadow:0 10px 30px rgba(255,150,40,.25)}
.btn.sec{border:1px solid #2f323c;color:var(--fg);background:rgba(255,255,255,.02)}
.hero .cmdbox{margin:8px auto 0;max-width:760px}
.free{font-size:13px;color:#6f7482;margin-top:12px}
.stage{position:relative;text-align:left;margin:54px auto 0;max-width:1060px;border-radius:26px;padding:18px 18px 0;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));box-shadow:0 40px 120px rgba(0,0,0,.6)}
.screen{position:relative;border-radius:16px 16px 0 0;height:500px;overflow:hidden;
  background:linear-gradient(160deg,#1c2330 0%,#151a24 45%,#1d1a26 100%)}
.screen .win{position:absolute;left:14%;right:14%;top:140px;bottom:0;transition:left .45s,right .45s;border-radius:12px 12px 0 0;background:#0d1016;border:1px solid #232835;padding:16px;font-family:'Cascadia Mono',Consolas,Menlo,monospace;font-size:12.5px;color:#9aa3b5;line-height:1.75;text-align:left}
.win .l{opacity:.25;transition:opacity .4s}.win .l.on{opacity:1}
.win .hl{color:#ffd79a}
.screen .isl{position:absolute;left:50%;top:14px;transform:translateX(-50%)}
.screen .pnl{position:absolute;right:4%;top:62px;transform-origin:top right;transform:scale(.86)}
.screen .tst{position:absolute;left:50%;top:62px;transform:translateX(-50%);transition:opacity .35s,transform .35s}
.screen .tst.off{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
.screen.side .win{left:5%;right:46%}.screen.side .tst{left:5%;transform:none}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,rgba(7,8,11,.95));pointer-events:none}
.caption{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0 20px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid #2a2d36;color:var(--mut)}
.chip.on{color:#1a1205;border-color:transparent}
.caption p{margin:0;width:100%;text-align:center;color:var(--fg);font-size:15px;min-height:24px}
.caption .pp{font-size:12px;border:1px solid #2a2d36;background:transparent;color:var(--mut);border-radius:999px;padding:6px 12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:46px auto 0;max-width:820px}
.stats div{text-align:center}.stats b{display:block;font-size:34px;font-weight:800}.stats span{font-size:13px;color:var(--mut)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.screen{height:440px}.screen .pnl{display:none}.screen .win,.screen.side .win{left:5%;right:5%}.screen.side .tst{left:50%;transform:translateX(-50%)}}
section{padding:90px 0 0}
section h2{font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;margin:0;text-align:center}
section .lead{color:var(--mut);text-align:center;max-width:640px;margin:10px auto 36px;font-size:16px}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.feat{grid-template-columns:minmax(0,1fr)}}
.feat article{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;overflow:hidden}
.feat article::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;top:-80px;right:-60px;background:var(--glow);opacity:.14;filter:blur(30px)}
.feat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
.feat h3{margin:0 0 6px;font-size:17px}.feat p{margin:0;color:var(--mut);font-size:14.5px}
.play{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
@media (max-width:960px){.play{grid-template-columns:minmax(0,1fr)}}
.bigb{border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,#1c2330,#151a24);min-height:320px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;padding:26px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}.lb{font-size:12px;color:#b4b8c2}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mgrid button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:11.5px;cursor:pointer;min-height:44px}
.mgrid button[aria-pressed="true"]{border-color:var(--acc);color:var(--fg);box-shadow:0 0 0 1px var(--acc)}
.inst{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.inst{grid-template-columns:minmax(0,1fr)}}
.inst article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.inst h3{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:600}
.inst pre{margin:0 0 12px;background:#07080b;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-size:13px;font-family:'Cascadia Mono',Consolas,Menlo,monospace}
.inst .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.inst button{font-size:12px;font-weight:700;border:1px solid #2f323c;background:transparent;color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.priv{margin:90px auto 0;max-width:780px;text-align:center;border:1px solid var(--line);border-radius:22px;padding:30px;background:var(--card)}
.priv h2{font-size:26px}.priv p{color:var(--mut);margin:10px 0 0}
footer{margin-top:80px;border-top:1px solid var(--line);padding:28px 0 50px;color:#7a7f8c;font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
footer a{color:#9ea3b0}
.sw{width:36px;height:22px;border-radius:11px;position:relative;flex:none}.sw i{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<nav><div class="wrap"><a class="brand" href="#top" id="brand"></a><div class="links" id="links"></div><span class="sp"></span><span id="lang"></span><a class="gh" href="https://github.com/hakienit/pet-tracker">GitHub</a></div></nav>
<main id="top"></main>
<footer><div class="wrap" id="foot"></div></footer>
<script src="../assets/wisp-ui.js"></script>
<script src="../assets/landing-copy.js"></script>
<script>
let STAGE = 'idle', loop = null;
const t = T.dark;
function toastHTML(kind) {
  const l = L();
  if (kind === 'wait') return `<div style="width:330px;background:${t.surf};border:1px solid ${t.line};border-radius:14px;box-shadow:${t.shadow};padding:12px 14px;display:flex;gap:12px;text-align:left;color:${t.fg}"><span style="color:${t.wait}">${ic('bell', 18, 2.2)}</span><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">${l.toast[0][0]}</div><div class="mono ell" style="font-size:12px;color:${t.mut}">${l.toast[0][1]}</div></div></div>`;
  return `<div style="width:330px;background:${t.surf};border:1px solid ${t.line};border-radius:14px;box-shadow:${t.shadow};padding:12px 14px;display:flex;gap:12px;text-align:left;color:${t.fg}"><span style="color:${t.done}">${ic('done', 18, 2.2)}</span><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">${l.toast[1][0]}</div><div class="ell" style="font-size:12px;color:${t.mut}">${l.toast[1][1]}</div></div></div>`;
}
const TERM = ['$ claude', '> fix the auth redirect bug', '● Read src/auth/redirect.ts', '● Edit src/auth/redirect.ts (+12 −3)', '● Bash(npm test)  ✓ 48 passed', '? Allow Bash: git push origin main  [y/N]', '✓ Pushed. Redirect fixed and tested.'];
const TERM_ON = { idle: 1, run: 5, wait: 6, done: 7 };
function stageHTML() {
  return `<div class="screen ${STAGE === 'wait' ? 'side' : ''}"><div class="win">${TERM.map((x, i) => `<div class="l ${i < TERM_ON[STAGE] ? 'on' : ''} ${i === 5 && STAGE === 'wait' ? 'hl' : ''}">${escH(x)}</div>`).join('')}</div>
    <div class="isl">${island(STAGE, t)}</div>
    <div class="tst ${STAGE === 'wait' || STAGE === 'done' ? '' : 'off'}">${toastHTML(STAGE)}</div>
    <div class="pnl" style="transition:opacity .35s;opacity:${STAGE === 'wait' ? 1 : 0}">${STAGE === 'wait' ? panel(t) : ''}</div></div>`;
}
function setStage(s) {
  STAGE = s;
  const host = document.getElementById('stage');
  if (!host) return;
  uid = 0;
  host.innerHTML = stageHTML();
  const c = C(), i = DEMO.indexOf(s);
  document.getElementById('cap').innerHTML = DEMO.map((k, j) => `<span class="chip ${j === i ? 'on' : ''}" style="${j === i ? `background:${t[k === 'idle' ? 'idle' : k]}` : ''}">${L().st[k]}</span>`).join('') +
    `<button class="pp" id="pp">${loop && !loop.playing ? c.play : c.pause}</button><p>${c.demo[i]}</p>`;
}
function render() {
  const c = C(), l = L();
  document.documentElement.lang = LANG;
  document.getElementById('brand').innerHTML = `${mascot(MASCOT, 28, 'run', t, '')}Wisp`;
  document.getElementById('links').innerHTML = ['#features', '#custom', '#mascots', '#install'].map((h, i) => `<a href="${h}">${c.links[i]}</a>`).join('');
  document.getElementById('lang').innerHTML = langSwitch('seg');
  const st = BUBTYPE === 'mascot' ? ['idle', 'run', 'wait', 'done', 'quota'] : ['idle', 'run', 'wait', 'quota'];
  document.getElementById('top').innerHTML = `
  <div class="wrap hero" data-shot="hero">
    <span class="eyebrow">${ic('bell', 14, 2.2)}${c.eyebrow}</span>
    <h1>${c.h1.replace(/(agents need you|agent cần bạn)/, '<em>$1</em>')}</h1>
    <p class="sub">${c.sub}</p>
    <div class="cta"><a class="btn pri" href="${WIN_ZIP}">${ic('dl', 18, 2.2)}${c.dlWin}</a><a class="btn sec" href="${MAC_DMG}">${c.dlMac}</a></div>
    <div class="cmdlbl">${c.orCmd}</div><div class="cmdbox">${cmdBlock(WIN_CMD)}</div>
    <div class="free">${c.free}</div>
    <div class="stage" data-shot="demo"><div id="stage"></div><div class="caption" id="cap"></div></div>
    <div class="stats">${c.stats.map(([n, s]) => `<div><b>${n}</b><span>${s}</span></div>`).join('')}</div>
  </div>
  <section id="features" data-shot="features"><div class="wrap"><h2>${c.fH}</h2><p class="lead">${c.fL}</p>
    <div class="feat">${c.feats.map(([icn, col, h, p]) => `<article style="--glow:${t[col]}"><span class="ic" style="background:${t[col]}1f;color:${t[col]}">${ic(icn, 21, 2.2)}</span><h3>${h}</h3><p>${p}</p></article>`).join('')}</div></div></section>
  <section id="custom" data-shot="custom"><div class="wrap"><h2>${c.cH}</h2><p class="lead">${c.cL}</p>
    <div class="play"><div class="bigb">${st.map((v) => `<div class="cell">${bubble(v, t)}<span class="lb" style="margin-top:${BUBTYPE === 'mascot' ? 8 : 0}px">${l.st[v]}</span></div>`).join('')}</div><div>${bubbleSettings(t)}</div></div></div></section>
  <section id="mascots" data-shot="mascots"><div class="wrap"><h2>${c.mH}</h2><p class="lead">${c.mL}</p>
    <div class="mgrid">${MASCOTS.map((m) => `<button data-m="${m.id}" aria-pressed="${m.id === MASCOT}" title="${m[LANG]}">${mascot(m.id, 56, m.id === MASCOT ? 'done' : 'run', t, m.id === MASCOT ? 'm-done' : '')}<span class="ell" style="max-width:88px">${m[LANG]}</span></button>`).join('')}</div></div></section>
  <section id="install" data-shot="install"><div class="wrap"><h2>${c.inH}</h2><p class="lead">${c.inL}</p>
    <div class="inst"><article><h3>${c.win}</h3>${cmdBlock(WIN_CMD)}<div class="row"><a href="${WIN_ZIP}">${c.manual}: wisp-win-x64.zip</a></div></article>
    <article><h3>${c.mac}</h3>${cmdBlock(MAC_CMD)}<div class="row"><a href="${MAC_DMG}">${c.manual}: .dmg</a></div></article></div>
    <div class="priv"><h2>${c.prH}</h2><p>${c.prL}</p></div></div></section>`;
  document.getElementById('foot').innerHTML = `<span>${c.foot}</span><span>${footLinks()}</span>`;
  setTimeout(applyShot, 0);
  setStage(STAGE);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'pp') { loop.toggle(); setStage(STAGE); return; }
  const y = scrollY;
  if (handleCustomize(b)) { render(); scrollTo(0, y); }
});
wireCopy();
render();
loop = demoLoop(setStage);
</script>
</body>
</html>
