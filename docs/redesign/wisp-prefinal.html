<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wisp · bản pre-final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e11;--fg:#ebecf0;--mut:#a2a6b1;--line:#262830;--acc:#ffb02e;
  /* thang chữ dùng chung cho mọi màn hình của Wisp */
  --t-meta:12px;--t-body:13px;--t-title:14px;--t-head:15px;--t-num:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif}
button{font-family:inherit}
header.top{position:sticky;top:0;z-index:50;background:rgba(13,14,17,.95);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header.top h1{margin:0;font-size:18px;font-weight:700}
header.top nav{display:flex;flex-wrap:wrap;gap:4px 14px}
header.top nav a{color:var(--mut);text-decoration:none;font-size:13px}
header.top nav a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid #3a3d47;border-radius:9px;overflow:hidden;margin-left:auto}
.lang button{font-size:13px;font-weight:600;padding:7px 12px;min-height:34px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:#1a1205}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#picked{font-size:12px;color:var(--mut)}
main{padding:24px;display:flex;flex-direction:column;gap:48px;max-width:1380px}
h2{margin:0 0 6px;font-size:22px}
h3{margin:0;font-size:16px}
.lead{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.5;max-width:900px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-width:0}
.stage.dark{background:#252a31}.stage.light{background:#cfd6df}
.cap{font-size:12px;font-weight:600}
.stage.dark .cap,.stage.dark .lb{color:#b4b8c2}.stage.light .cap,.stage.light .lb{color:#3d4350}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.lb{font-size:12px}
.pick{font-size:13px;padding:7px 12px;min-height:34px;border-radius:9px;border:1px solid #3a3d47;background:#16181d;color:var(--fg);cursor:pointer;flex:none}
.pick:hover{border-color:var(--acc)}
.pick[aria-pressed="true"]{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{font-size:13px;padding:7px 12px;min-height:34px;border-radius:999px;border:1px solid #3a3d47;background:transparent;color:var(--mut);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#2a2c33;color:var(--fg);border-color:#4a4d57}
.hues{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--mut)}
.hues button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.hues button[aria-pressed="true"]{border-color:#fff}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mono{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.grid-m{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:#16181d;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.card .hd{display:flex;align-items:center;gap:8px}
.card .nm{font-size:14px;font-weight:700}
.card .no{font-size:12px;color:var(--mut)}
.moods{display:flex;gap:6px;background:#0f1013;border-radius:10px;padding:6px;justify-content:center}
.upload{border:1.5px dashed #4a4d57;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:13px}

/* viền động theo trạng thái: dải gradient chạy vòng quanh mép, nằm TRONG mép hình (bản tkinter cũng vậy) */
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
.ab{position:relative;isolation:isolate}
.ab::before,.ab::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--bw,2.5px);pointer-events:none;z-index:2;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ab::before{background:conic-gradient(from var(--fa),var(--c1),var(--c2) 20%,var(--c3) 35%,var(--c1) 50%,var(--c2) 70%,var(--c3) 85%,var(--c1));animation:fspin var(--sp) linear infinite}
.ab::after{display:none}
.ab-wait{--c1:#ffb02e;--c2:#ff6a1a;--c3:#e8432f;--sp:1.8s}
.ab-wait::after{display:block;background:conic-gradient(from calc(var(--fa) * -1.6),transparent,rgba(255,240,180,.9) 8%,transparent 16%,transparent 50%,rgba(255,220,140,.75) 58%,transparent 66%);animation:fspin 2.6s linear infinite}
.ab-run{--c1:#58a6ff;--c2:#b9dbff;--c3:#2f6fd6;--sp:2.6s}
.ab-done{--c1:#3fd0a4;--c2:#b4f2df;--c3:#1f9e7a;--sp:4.5s}
.ab-idle{--c1:#4f525b;--c2:#a3a6af;--c3:#4f525b;--sp:6s}
.ab-quota{--c1:#ff6166;--c2:#ffc2c4;--c3:#c62828;--sp:2.2s}
.ab-quota::before{animation:fspin var(--sp) linear infinite,pulse 1.2s ease-in-out infinite}
.ab-update{--c1:#58a6ff;--c2:#b9dbff;--c3:#2f6fd6;--sp:3s}
.light .ab-wait{--c1:#e08a00;--c2:#ff6a1a;--c3:#c2410c}
.light .ab-run{--c1:#1f5fd6;--c2:#8fb8ff;--c3:#123f99}
.light .ab-done{--c1:#0b7a5a;--c2:#7fd8b8;--c3:#065c43}
.light .ab-idle{--c1:#b7bac2;--c2:#6b6e78;--c3:#b7bac2}
.light .ab-quota{--c1:#c62828;--c2:#ff9a9a;--c3:#8e1b1b}
@keyframes fspin{to{--fa:360deg}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
.breathe{animation:breathe 1.6s ease-in-out infinite}
/* biểu cảm mascot trong panel */
@keyframes m-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes m-flick{0%,100%{transform:scale(1)}35%{transform:scale(1.05,.96)}70%{transform:scale(.96,1.05)}}
@keyframes m-bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-6%)}55%{transform:translateY(0)}70%{transform:translateY(-2%)}}
@keyframes m-hop{0%,70%,100%{transform:translateY(0) rotate(0)}80%{transform:translateY(-8%) rotate(-4deg)}90%{transform:translateY(0) rotate(3deg)}}
@keyframes m-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2%)}75%{transform:translateX(2%)}}
.m-idle{animation:m-breathe 3.2s ease-in-out infinite;transform-origin:50% 90%}
.m-run{animation:m-flick 1.4s ease-in-out infinite;transform-origin:50% 90%}
.m-wait{animation:m-bounce .9s ease-in-out infinite;transform-origin:50% 90%}
.m-done{animation:m-hop 2.4s ease-in-out infinite;transform-origin:50% 90%}
.m-quota{animation:m-shake .18s linear infinite}
/* bóng nổi dạng mascot: di chuyển, nhảy múa theo trạng thái; bóng đổ co giãn theo cú nhảy */
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-walk{0%,100%{transform:translate(-4px,0) rotate(-4deg)}25%{transform:translate(0,-6px)}50%{transform:translate(4px,0) rotate(4deg)}75%{transform:translate(0,-6px)}}
@keyframes b-jump{0%,100%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(.95,1.06)}45%{transform:translateY(-22px) scale(1,1)}75%{transform:translateY(0) scale(1.08,.92)}}
@keyframes b-dance{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-12deg) translateY(-8px)}40%{transform:rotate(0) translateY(0)}60%{transform:rotate(12deg) translateY(-8px)}80%{transform:rotate(0) translateY(0)}}
@keyframes b-tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-1deg)}75%{transform:translateX(2px) rotate(1deg)}}
@keyframes sh-jump{0%,100%{transform:scaleX(1);opacity:.45}45%{transform:scaleX(.55);opacity:.18}}
@keyframes sh-walk{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.8)}}
.b-idle{animation:b-sway 3.6s ease-in-out infinite;transform-origin:50% 100%}
.b-run{animation:b-walk .9s ease-in-out infinite;transform-origin:50% 100%}
.b-wait{animation:b-jump .8s cubic-bezier(.3,.7,.4,1) infinite;transform-origin:50% 100%}
.b-done{animation:b-dance 1.3s ease-in-out infinite;transform-origin:50% 100%}
.b-quota{animation:b-tremble .16s linear infinite;transform-origin:50% 100%}
.sh-wait{animation:sh-jump .8s cubic-bezier(.3,.7,.4,1) infinite}
.sh-run{animation:sh-walk .9s ease-in-out infinite}
.sh-done{animation:sh-walk 1.3s ease-in-out infinite}
/* hiệu ứng phụ quanh bóng mascot */
@keyframes fx-z{0%{transform:translate(0,0) scale(.7);opacity:0}20%{opacity:1}100%{transform:translate(10px,-26px) scale(1.1);opacity:0}}
@keyframes fx-dust{0%{transform:translate(0,0) scale(.6);opacity:.7}100%{transform:translate(-14px,-4px) scale(1.4);opacity:0}}
@keyframes fx-wave{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes fx-pop{0%,100%{transform:scale(0);opacity:0}30%{transform:scale(1.1);opacity:1}70%{transform:scale(.9) translateY(-6px);opacity:.8}}
@keyframes fx-drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes fx-glow{0%,100%{opacity:.25;transform:scaleX(1)}50%{opacity:.6;transform:scaleX(1.15)}}
@keyframes look{0%,40%,100%{transform:translateX(0)}50%,70%{transform:translateX(1.6px)}80%,90%{transform:translateX(-1.6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.fx{position:absolute;pointer-events:none}
.fx-z{animation:fx-z 2.4s ease-out infinite;font-weight:800}
.fx-dust{animation:fx-dust .9s ease-out infinite}
.fx-wave{animation:fx-wave 1.2s ease-out infinite;border-radius:50%}
.fx-pop{animation:fx-pop 1.3s ease-in-out infinite}
.fx-drip{animation:fx-drip 1.1s ease-in infinite}
.fx-glow{animation:fx-glow 1s ease-in-out infinite}
.look-run{animation:look 3s ease-in-out infinite}
.blink{animation:blink 4s linear infinite;transform-origin:50% 45%;transform-box:fill-box}
/* xác nhận xoá: giữ để xoá, đếm ngược */
@keyframes holdfill{0%{width:0}80%,100%{width:100%}}
.holdfill{animation:holdfill 2.2s ease-in infinite}
@keyframes countdown{from{stroke-dashoffset:0}to{stroke-dashoffset:100}}
.countdown{animation:countdown 5s linear infinite}
@keyframes slidehint{0%,100%{transform:translateX(0)}50%{transform:translateX(150px)}}
.slidehint{animation:slidehint 2.4s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.indet{animation:indet 1.2s ease-in-out infinite}
@keyframes comet{to{stroke-dashoffset:-100}}
.comet{animation:comet var(--sp,2.4s) linear infinite}
@media (prefers-reduced-motion: reduce){.ab::before,.ab::after,.breathe,.m-idle,.m-run,.m-wait,.m-done,.m-quota,.indet,.comet,
  .b-idle,.b-run,.b-wait,.b-done,.b-quota,.sh-wait,.sh-run,.sh-done,.fx,.look-run,.blink,.holdfill,.countdown,.slidehint{animation:none}}
.sw{width:36px;height:22px;border-radius:11px;position:relative;flex:none}
.sw i{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.lane-h{display:flex;align-items:center;gap:6px;font-size:var(--t-body);font-weight:700;border:0;background:transparent;padding:4px 2px;min-height:30px;cursor:pointer;width:100%;text-align:left}
footer{padding:0 24px 40px;color:var(--mut);font-size:13px;line-height:1.6;max-width:900px}
</style>
</head>
<body>
<header class="top">
  <h1 id="h1"></h1>
  <nav id="nav"></nav>
  <span id="picked" aria-live="polite"></span>
  <div class="lang" role="group" aria-label="Language"><button data-l="vi">Tiếng Việt</button><button data-l="en">English</button></div>
</header>
<main id="main"></main>
<footer id="foot"></footer>

  return `<div style="width:400px;border-radius:18px;background:${t.bg};border:1px solid ${t.line};color:${t.fg};box-shadow:${t.shadow};overflow:hidden">
    <div style="display:flex;align-items:center;gap:8px;padding:12px 14px"><span style="width:32px;height:32px;display:grid;place-items:center;color:${t.fg}">${ic('back', 18, 2.2)}</span><span style="font-size:var(--t-head);font-weight:800">${s.title}</span></div>
    <div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:14px">
      ${grp(s.general, [row(s.lang, seg(['Tiếng Việt', 'English'], LANG === 'vi' ? 0 : 1)), row(s.theme, seg(s.themeOpts, 0)), row(s.mode, seg(s.modeOpts, 0)), row(s.bubble, val(bub)), row(s.screen, val(s.screenVal)),
        row(s.mascot, `<span style="display:flex;align-items:center;gap:6px;flex:none">${mascot(MASCOT, 28, 'run', t, '')}${ic('chev', 14)}</span>`), row(s.motion, seg(s.motionOpts, 0)), row(s.startup, sw(true))])}
      ${grp(s.notif, [row(s.sWait, sw(true)), row(s.sDone, sw(false)), row(s.nDone, sw(true)), row(s.quiet, sw(false), s.quietVal), row(s.qAlert, val('80% · 95%'))])}
      ${grp(s.hooks, [row(`<span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:4px;background:${t.ok}"></span>${s.hooksOn}</span>`, '', s.hooksSub), `<div style="display:flex;gap:8px;padding:9px 12px">${btn2(t, s.hooksTest)}${btn2(t, s.hooksBtn)}</div>`])}
      ${grp(s.quota, [row(s.warn, stepper('60%')), row(s.danger, stepper('85%')), row(s.api, sw(true))])}
      ${grp(s.update, [`<div style="padding:8px 12px">${updBanner(t, 'latest')}</div>`, row(s.autoUpd, sw(true)), row(s.checkNow, `<span style="color:${t.mut};border:1px solid ${t.line};border-radius:8px;width:32px;height:30px;display:grid;place-items:center">${ic('refresh', 14)}</span>`)])}
      ${grp(s.adv, [act(s.refresh, 'refresh'), act(s.openClaude, 'folder'), act(s.openCfg, 'info'), act(s.openLog, 'info'), act(s.quit, 'power', true)])}
    </div></div>`;
}

// ================================================================ menu + thông báo
function menus(t) {
  const m = L().menu;
  const box = (inner, w = 340) => `<div style="width:${w}px;background:${t.menuBg};border:1px solid ${t.line};border-radius:12px;box-shadow:${t.shadow};padding:6px 0;color:${t.fg}">${inner}</div>`;
  const it = (icon, lab, sub, o = {}) => `<div style="display:flex;align-items:center;gap:10px;margin:0 6px;padding:8px 10px;min-height:36px;border-radius:8px;${o.hover ? `background:${t.hover};` : ''}${o.dis ? 'opacity:.5;' : ''}color:${o.danger ? t.danger : t.fg}"><span style="color:${o.danger ? t.danger : t.mut}">${ic(icon, 16)}</span><span style="flex:1;font-size:var(--t-body)">${lab}</span>${sub ? `<span class="ell" style="font-size:var(--t-meta);color:${t.mut};max-width:170px">${sub}</span>` : ''}</div>`;
  const sep = `<div style="height:1px;background:${t.line};margin:5px 12px"></div>`;
  const head = `<div style="padding:8px 16px 10px"><div style="font-size:var(--t-title);font-weight:700">fix-auth-redirect</div><div class="ell" style="font-size:var(--t-meta);color:${t.mut}">D:\\vinova\\pet-tracker</div><div style="font-size:var(--t-meta);color:${t.warn}">⎇ hakienit/fix-auth · ${m.dirty}</div></div>${sep}`;
  const sess = box(head + it('open', m.open, m.openSub, { hover: true }) + it('folder', m.folder) + it('copy', m.copy) + it('info', m.details, m.detailsSub) + sep + it('mute', m.mute) + sep
    + it('exit', m.handoff, m.handoffSub) + it('x', m.close, m.closeSub) + it('trash', m.del, m.delSub, { danger: true }) + it('branch', m.wt, m.wtSub, { danger: true, dis: true }));
  const conf = box(head + it('x', m.close, m.closeSub) + `<div style="margin:2px 6px;padding:10px;border-radius:8px;background:${t.dangerBg}"><div style="display:flex;align-items:center;gap:8px;color:${t.danger};font-size:var(--t-body);font-weight:700">${ic('trash', 16)}${m.confirm}</div><div style="display:flex;gap:8px;margin-top:9px">${btn(t, m.yes, t.danger)}${btn2(t, m.no)}</div></div>`);
  const isl = box(it('refresh', m.isl[0]) + it('gear', m.isl[1]) + it('swap', m.isl[2]) + it('mute', m.isl[3]) + it('dl', m.isl[4], 'v0.2.0') + sep + it('power', m.isl[5], '', { danger: true }), 260);
  return `<div class="row" style="align-items:flex-start;gap:16px">${[sess, conf, isl].map((h, i) => `<div style="display:flex;flex-direction:column;gap:8px"><span class="lb">${m.menuCaps[i]}</span>${h}</div>`).join('')}</div>`;
}
function toasts(t) {
  const l = L();
  const one = (k, [a, b], btns) => `<div style="width:340px;background:${t.surf};color:${t.fg};border:1px solid ${t.line};border-radius:12px;box-shadow:${t.shadow};padding:12px 14px;display:flex;gap:12px;align-items:flex-start">
    <span style="color:${t[k]};margin-top:1px">${ic(k === 'wait' ? 'bell' : k === 'done' ? 'done' : 'trend', 18, 2.2)}</span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><div style="font-size:var(--t-body);font-weight:700">${a}</div><div class="ell ${k === 'wait' ? 'mono' : ''}" style="font-size:var(--t-meta);color:${t.mut}">${b}</div>${btns ? `<div style="display:flex;gap:8px;margin-top:8px">${btns}</div>` : ''}</div></div>`;
  return [one('wait', l.toast[0], btn(t, l.open, t.wait) + btn2(t, l.later)), one('done', l.toast[1], btn2(t, l.open)), one('danger', l.toast[2], '')].join('');
}

// ================================================================ 6 kiểu xác nhận xoá
function confirmDemo(i, t) {
  const c = L().cf;
  const lines = `<ul style="margin:6px 0 0;padding-left:18px;font-size:var(--t-meta);color:${t.fg2};line-height:1.6">${c.lines.map((x) => `<li>${x}</li>`).join('')}</ul>`;
  const head = `<div style="padding:8px 14px 10px;border-bottom:1px solid ${t.line}"><div style="font-size:var(--t-title);font-weight:700">fix-auth-redirect</div><div class="ell" style="font-size:var(--t-meta);color:${t.mut}">D:\\vinova\\pet-tracker</div></div>`;
  const box = (inner, w = 340) => `<div style="width:${w}px;max-width:100%;background:${t.menuBg};border:1px solid ${t.line};border-radius:12px;box-shadow:${t.shadow};color:${t.fg};overflow:hidden">${inner}</div>`;
  const dangerBtn = (lab, extra = '') => `<button style="font-size:var(--t-body);font-weight:700;padding:7px 12px;min-height:34px;border-radius:9px;border:0;background:${t.danger};color:#fff;${extra}">${lab}</button>`;
  if (i === 0) return box(head + `<div style="margin:8px;padding:12px;border-radius:10px;background:${t.dangerBg};box-shadow:inset 0 0 0 1px ${t.danger}44">
      <div style="display:flex;align-items:center;gap:8px;color:${t.danger};font-size:var(--t-body);font-weight:700">${ic('trash', 16)}${c.title}</div>${lines}
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">${btn2(t, c.cancel)}${dangerBtn(c.del)}</div></div>`);
  if (i === 1) return `<div style="position:relative;width:340px;max-width:100%;height:250px;border-radius:14px;overflow:hidden;background:${t.bg};border:1px solid ${t.line}">
      <div style="padding:14px;display:flex;flex-direction:column;gap:8px;opacity:.5">${[1, 2, 3].map(() => `<div style="height:44px;border-radius:10px;background:${t.surf};border:1px solid ${t.line}"></div>`).join('')}</div>
      <div style="position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center"><div style="width:290px;background:${t.surf};color:${t.fg};border-radius:14px;padding:16px;box-shadow:${t.shadow}">
        <div style="width:36px;height:36px;border-radius:50%;background:${t.dangerBg};color:${t.danger};display:grid;place-items:center">${ic('trash', 18, 2.2)}</div>
        <div style="font-size:var(--t-head);font-weight:800;margin-top:10px">${c.title}</div>${lines}
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px">${btn2(t, c.cancel).replace('flex:none', 'width:100%')}${dangerBtn(c.del, 'width:100%')}</div></div></div></div>`;
  if (i === 2) return box(head + `<div style="padding:12px;display:flex;flex-direction:column;gap:8px">${lines}
      <div style="position:relative;height:40px;border-radius:10px;background:${t.dangerBg};box-shadow:inset 0 0 0 1px ${t.danger}66;overflow:hidden">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--t-body);font-weight:700;color:${t.danger}">${ic('trash', 15, 2.2)}${c.hold}</div>
      <div class="holdfill" style="position:absolute;inset:0 auto 0 0;background:${t.danger};overflow:hidden"><div style="position:absolute;left:0;top:0;width:314px;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--t-body);font-weight:700;color:#fff">${ic('trash', 15, 2.2)}${c.hold}</div></div></div>
      <div style="font-size:var(--t-meta);color:${t.mut};text-align:center">1,5 s · Esc = ${c.cancel}</div></div>`);
  if (i === 3) return box(head + `<div style="padding:12px;display:flex;flex-direction:column;gap:10px">${lines}
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1.5px solid ${t.danger};color:${t.danger}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="${t.danger}33" stroke-width="3"/><circle class="countdown" cx="12" cy="12" r="9" fill="none" stroke="${t.danger}" stroke-width="3" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 12 12)"/></svg>
      <span style="flex:1;font-size:var(--t-body);font-weight:700">${c.again}</span><span class="num" style="font-size:var(--t-meta)">5 s</span></div></div>`);
  if (i === 4) return `<div style="width:340px;max-width:100%;display:flex;flex-direction:column;gap:8px"><div style="opacity:.45">${box(head)}</div>
      <div style="background:${t.surf};color:${t.fg};border:1px solid ${t.line};border-radius:12px;box-shadow:${t.shadow};overflow:hidden"><div style="display:flex;align-items:center;gap:10px;padding:11px 12px">
      <span style="color:${t.danger}">${ic('trash', 17, 2.2)}</span><div style="flex:1;min-width:0"><div style="font-size:var(--t-body);font-weight:700">${c.undoMsg}</div><div style="font-size:var(--t-meta);color:${t.mut}">${c.undoSub}</div></div>
      <button style="font-size:var(--t-body);font-weight:700;padding:7px 12px;border-radius:9px;border:0;background:${t.run};color:#fff">${c.undo}</button></div><div style="height:3px;background:${t.track}"><div class="holdfill" style="height:100%;background:${t.danger};animation-duration:8s;animation-direction:reverse"></div></div></div></div>`;
  return box(head + `<div style="padding:12px;display:flex;flex-direction:column;gap:10px">${lines}
      <div style="position:relative;height:42px;border-radius:21px;background:${t.dangerBg};box-shadow:inset 0 0 0 1px ${t.danger}55;display:flex;align-items:center;justify-content:center;font-size:var(--t-body);font-weight:700;color:${t.danger}">${c.slide} →
      <span class="slidehint" style="position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:${t.danger};color:#fff;display:grid;place-items:center">${ic('trash', 15, 2.2)}</span></div></div>`);
}

// ================================================================ dựng trang
const pickBtn = (attr, id, on) => `<button class="pick" ${attr}="${id}" aria-pressed="${on}">${on ? L().picked : L().pick}</button>`;
function render() {
  const l = L();
  uid = 0;
  document.documentElement.lang = LANG;
  document.title = l.title;
  document.getElementById('h1').textContent = l.title;
  const ids = ['island', 'bubble', 'mbubble', 'mascot', 'panel', 'update', 'settings', 'menu', 'confirm', 'toast'];
  document.getElementById('nav').innerHTML = ids.map((id, i) => `<a href="#${id}">${l.nav[i]}</a>`).join('');
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === LANG));
  const mm = MASCOTS.find((x) => x.id === MASCOT), sg = SIG.find((x) => x.id === SIGSEL), mb = MASCOTS.find((x) => x.id === MBSEL);
  document.getElementById('picked').textContent = `Mascot: ${mm ? mm[LANG] : '–'} · ${l.nav[1]}: ${sg ? sg[LANG] : '–'} · ${l.nav[2]}: ${mb ? mb[LANG] : '–'} · ${l.nav[8]}: ${CONF !== '' ? l.cfNames[+CONF] : '–'}`;
  const sec = (id, h, lead, body) => `<section id="${id}"><h2>${h}</h2><p class="lead">${lead}</p>${body}</section>`;
  const st4 = ['idle', 'run', 'wait', 'quota'], st5 = ['idle', 'run', 'wait', 'done', 'quota'];
  const list = CATSEL === 'all' ? MASCOTS : MASCOTS.filter((x) => CAT[CATSEL].includes(x.id));
  const mGallery = `<div class="tabs" role="group">${Object.keys(l.cats).map((k) => `<button data-cat="${k}" aria-pressed="${k === CATSEL}">${l.cats[k]} <span style="opacity:.6">${k === 'all' ? MASCOTS.length : CAT[k].length}</span></button>`).join('')}</div>
    <div class="hues">${l.hue}: ${HUE_SW.map((c, i) => `<button data-hue="${i}" aria-pressed="${i === HUE}" aria-label="${l.hueNames[i]}" title="${l.hueNames[i]}" style="background:${c}"></button>`).join('')}</div>
    <div class="grid-m">${list.map((x) => `<div class="card ${x.id === MASCOT ? 'on' : ''}" style="align-items:center">
      <div class="hd" style="align-self:stretch"><span class="no num">${x.id.slice(1)}</span><span class="nm">${x[LANG]}</span></div>
      ${mascot(x.id, 88, 'run', T.dark)}<div class="moods">${['idle', 'run', 'wait', 'done', 'quota'].map((md) => mascot(x.id, 30, md, T.dark, '')).join('')}</div>${pickBtn('data-m', x.id, x.id === MASCOT)}</div>`).join('')}
      <div class="card upload"><span style="color:var(--fg)">${ic('up', 28, 2)}</span><span class="nm" style="color:var(--fg)">${l.upload[0]}</span><span>${l.upload[1]}</span><button class="pick">${l.upload[2]}</button></div></div>
    <p class="lead" style="margin-top:12px">${l.moods.join(' · ')}</p>`;
  const sigList = `<div style="display:flex;flex-direction:column;gap:12px">${SIG.map((sv) => `<div class="card ${sv.id === SIGSEL ? 'on' : ''}"><div class="hd"><span class="no num">${sv.id.slice(1)}</span><h3>${sv[LANG]}</h3><span style="flex:1"></span>${pickBtn('data-sig', sv.id, sv.id === SIGSEL)}</div>
      <div class="duo">${both((t) => `<div class="row">${st4.map((v) => `<div class="cell">${sigBubble(sv, v, t)}<span class="lb">${l.st[v]}</span></div>`).join('')}<div class="cell">${sigBubble(sv, 'run', t, true)}<span class="lb">${l.updLamp}</span></div></div>`)}</div></div>`).join('')}</div>`;
  const tmb = T[MBTHEME];
  const mbCtl = `<div class="tabs" role="group"><span style="align-self:center;font-size:13px;color:var(--mut)">${l.chipLbl}:</span>${l.chips.map((c, i) => `<button data-chip="${i}" aria-pressed="${i === CHIP}">${c}</button>`).join('')}
    <span style="width:16px"></span><span style="align-self:center;font-size:13px;color:var(--mut)">${l.themeLbl}:</span>${['dark', 'light'].map((k) => `<button data-mbt="${k}" aria-pressed="${k === MBTHEME}">${l[k]}</button>`).join('')}</div>`;
  const mbList = mbCtl + `<div class="grid-m" style="grid-template-columns:repeat(auto-fill,minmax(540px,1fr))">${MASCOTS.map((m) => `<div class="card ${MBSEL === m.id ? 'on' : ''}"><div class="hd"><span class="no num">${m.id.slice(1)}</span><h3>${m[LANG]}</h3><span style="flex:1"></span>${pickBtn('data-mb', m.id, MBSEL === m.id)}</div>
      <div class="stage ${MBTHEME}" style="padding:12px 10px 18px"><div class="row" style="gap:4px 6px;justify-content:space-between">${st5.map((v) => `<div class="cell" style="width:92px">${mascotBubble(m.id, v, tmb)}<span class="lb" style="margin-top:10px">${l.st[v]}</span></div>`).join('')}</div></div></div>`).join('')}</div>`;
  const cfList = `<div class="grid-m" style="grid-template-columns:minmax(0,1fr)">${l.cfNames.map((nm, i) => `<div class="card ${CONF === String(i) ? 'on' : ''}"><div class="hd"><span class="no num">${String(i + 1).padStart(2, '0')}</span><h3>${nm}</h3><span style="flex:1"></span>${pickBtn('data-conf', String(i), CONF === String(i))}</div><div class="duo">${both((t) => `<div style="display:flex;justify-content:center">${confirmDemo(i, t)}</div>`)}</div></div>`).join('')}</div>`;
  const updKinds = ['avail', 'dl', 'verify', 'install', 'err', 'mac', 'latest'];
  const html = [
    sec('island', l.sIsland, l.lIsland, `<div class="duo">${both((t) => st4.map((v) => `<div class="row" style="gap:16px"><span class="lb" style="width:110px">${l.st[v]}</span>${island(v, t)}</div>`).join('') + `<div class="row" style="gap:16px"><span class="lb" style="width:110px">${l.updLamp}</span>${island('run', t, true)}</div>`)}</div>`),
    sec('bubble', l.sBubble, l.lBubble, sigList),
    sec('mbubble', l.sMb, l.lMb, mbList),
    sec('mascot', l.sMascot, l.lMascot, mGallery),
    sec('panel', l.sPanel, l.lPanel, `<div class="duo">${both((t) => `<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${island('wait', t, true)}${panel(t)}</div>`)}</div>`),
    sec('update', l.nav[5], '', `<div class="duo">${both((t) => updKinds.map((k, i) => `<div style="display:flex;flex-direction:column;gap:6px"><span class="lb">${l.updLabels[i]}</span><div style="width:372px;max-width:100%;background:${t.bg};border-radius:14px;padding:10px">${updBanner(t, k)}</div></div>`).join(''))}</div>`),
    sec('settings', l.set.title, '', `<div class="duo">${both((t) => `<div style="display:flex;justify-content:center">${settings(t)}</div>`)}</div>`),
    sec('menu', l.nav[7], '', `<div style="display:flex;flex-direction:column;gap:16px">${both((t) => menus(t))}</div>`),
    sec('confirm', l.sConfirm, l.lConfirm, cfList),
    sec('toast', l.nav[9], '', `<div class="duo">${both((t) => `<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">${toasts(t)}</div>`)}</div>`),
  ];
  const main = document.getElementById('main');
  main.innerHTML = html.join('');
  main.querySelectorAll('.lead:empty').forEach((p) => p.remove());
  const only = new URLSearchParams(location.search).get('s'); // ?s=mascot: chỉ hiện một mục
  if (only) main.querySelectorAll('section').forEach((s) => { s.hidden = s.id !== only; });
  document.getElementById('foot').textContent = l.foot;
}
const keep = (fn) => { const y = scrollY; fn(); render(); scrollTo(0, y); };
document.querySelector('.lang').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) keep(() => { LANG = b.dataset.l; ls('wisp-lang', LANG); });
});
document.getElementById('main').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.m) keep(() => { MASCOT = b.dataset.m; ls('wisp-mascot', MASCOT); });
  else if (b.dataset.sig) keep(() => { SIGSEL = b.dataset.sig; ls('wisp-sig', SIGSEL); });
  else if (b.dataset.mb) keep(() => { MBSEL = b.dataset.mb; ls('wisp-mb', MBSEL); });
  else if (b.dataset.cat) keep(() => { CATSEL = b.dataset.cat; });
  else if (b.dataset.hue) keep(() => { HUE = +b.dataset.hue; ls('wisp-hue', String(HUE)); });
  else if (b.dataset.chip) keep(() => { CHIP = +b.dataset.chip; ls('wisp-chip', String(CHIP)); });
  else if (b.dataset.mbt) keep(() => { MBTHEME = b.dataset.mbt; });
  else if (b.dataset.conf) keep(() => { CONF = b.dataset.conf; ls('wisp-conf', CONF); });
  else if (b.dataset.lane) keep(() => { COLL[b.dataset.lane] = !COLL[b.dataset.lane]; ls('wisp-coll', JSON.stringify(COLL)); });
});
render();
</script>
</body>
</html>
